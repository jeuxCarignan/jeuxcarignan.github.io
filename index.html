<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon cartable</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<script src="score.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cartable">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<script>
/* =========================================================
   RÉGLAGES — c'est ici que l'on modifie le cartable
   ========================================================= */

// Prénom affiché en haut (laisser "" pour afficher « Mon cartable »)
const PRENOM = "";

// La liste des jeux. Pour ajouter un jeu : copier une ligne,
// mettre le fichier dans le dossier « jeux », changer le texte.
// « id » = le nom donné à la note dans le jeu (Cartable.enregistrer).
// Couleurs possibles : bleu, orange, vert, rose, violet
const JEUX = [
  { id: "comparer", titre: "Plus grand, plus petit", texte: "Comparer les nombres de 0 à 100", fichier: "jeux/comparer.html", emoji: "🐊", matiere: "Nombres", couleur: "bleu" },
  { id: "bdpq", titre: "b, d, p, q", texte: "Ne plus confondre ces lettres", fichier: "jeux/bdpq.html", emoji: "🔤", matiere: "Lecture", couleur: "orange" },
  { id: "cg", titre: "c et g", texte: "ke ou se ? gue ou je ?", fichier: "jeux/cg.html", emoji: "🦒", matiere: "Lecture", couleur: "vert" },
];
</script>
<style>
:root{
  --paper:#F6F9FF; --line:#D6E2F7; --line2:#B9CCEE; --margin:#EFA0A0;
  --ink:#1D2A4D; --soft:#5A6788; --card:#FFFFFF;
  --bleu:#2F6FDB; --orange:#F29B30; --vert:#2E9E5B; --rose:#E0508A; --violet:#7A5AD8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131A2B; --line:#1C2640; --line2:#26345A; --margin:#5A2A33;
    --ink:#EEF2FF; --soft:#A6B1D1; --card:#1C2540;
    --bleu:#6B9BF0; --orange:#F5AE52; --vert:#4CC27E; --rose:#F27AAE; --violet:#A28BF0;
  }
}
:root[data-theme="dark"]{
  --paper:#131A2B; --line:#1C2640; --line2:#26345A; --margin:#5A2A33;
  --ink:#EEF2FF; --soft:#A6B1D1; --card:#1C2540;
  --bleu:#6B9BF0; --orange:#F5AE52; --vert:#4CC27E; --rose:#F27AAE; --violet:#A28BF0;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{
  font-family:"Andika","Comic Sans MS",system-ui,sans-serif;color:var(--ink);
  background-color:var(--paper);
  background-image:
    linear-gradient(90deg,transparent 22px,var(--margin) 22px,var(--margin) 24px,transparent 24px),
    repeating-linear-gradient(0deg,var(--line2) 0 1px,transparent 1px 32px),
    repeating-linear-gradient(0deg,var(--line) 0 1px,transparent 1px 8px),
    repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 32px);
  -webkit-tap-highlight-color:transparent;
}
main{max-width:560px;margin:0 auto;padding:20px 16px 32px 36px}
h1{font-size:2.3rem;line-height:1.1;margin:16px 0 4px}
.sub{color:var(--soft);font-size:1.1rem;margin:0 0 18px}
.rec{display:inline-block;margin-top:6px;font-size:.92rem;font-weight:700;color:var(--ink);background:color-mix(in srgb,#F5B800 25%,var(--card));border-radius:10px;padding:2px 8px}
.reset{display:block;margin:36px auto 0;background:none;border:0;color:var(--soft);font:inherit;font-size:.9rem;text-decoration:underline;padding:10px;cursor:pointer}
h2{font-size:1.25rem;margin:26px 0 10px}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:480px){.grid{grid-template-columns:1fr 1fr}}
.tile{
  --c:var(--bleu);
  display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);
  background:var(--card);border:3px solid var(--c);border-radius:22px;
  padding:14px 16px;min-height:96px;box-shadow:0 6px 0 var(--c);
}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--c)}
.tile:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.tile .e{font-size:2.6rem;width:58px;height:58px;flex:none;display:grid;place-items:center;
  border-radius:16px;background:color-mix(in srgb,var(--c) 16%,var(--card))}
.tile b{display:block;color:var(--ink);font-size:1.3rem;line-height:1.15}
.tile em{font-style:normal}
.tile span{display:block;color:var(--soft);font-size:.98rem;margin-top:3px;line-height:1.25}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1 id="titre">Mon cartable</h1>
  <p class="sub">Choisis un jeu pour t'entraîner.</p>
  <div id="liste"></div>
  <button class="reset" id="reset">Effacer les notes (parents)</button>
</main>
<script>
document.getElementById("titre").textContent = PRENOM ? "Le cartable de " + PRENOM : "Mon cartable";
if (PRENOM) document.title = "Cartable de " + PRENOM;

const DATA = window.Cartable ? Cartable.lire() : { jeux: {} };
function recordDe(j){
  // la note du jeu, ou celle de sa variante jouée le plus récemment (ex. « bdpq-mot-bd »)
  if(!j.id) return "";
  const r = Object.entries(DATA.jeux)
    .filter(([k]) => k === j.id || k.startsWith(j.id + "-"))
    .map(([,v]) => v).sort((a,b) => (b.date||"").localeCompare(a.date||""))[0];
  return r ? `<em class="rec">Dernière note ${r.note}/${r.total}, meilleure ${r.meilleure}/${r.total}</em>` : "";
}
document.getElementById("reset").onclick = () => {
  if(confirm("Effacer toutes les notes sur ce téléphone ?")){ Cartable.remettreAZero(); location.reload(); }
};

const parMatiere = {};
JEUX.forEach(j => (parMatiere[j.matiere] ||= []).push(j));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("liste").innerHTML = Object.entries(parMatiere).map(([m, jeux]) =>
  `<h2>${esc(m)}</h2><div class="grid">` +
  jeux.map(j => `<a class="tile" href="${esc(j.fichier)}" style="--c:var(--${esc(j.couleur || "bleu")})">
      <span class="e" aria-hidden="true">${j.emoji || "⭐"}</span>
      <span><b>${esc(j.titre)}</b><span>${esc(j.texte || "")}</span>${recordDe(j)}</span>
    </a>`).join("") + `</div>`
).join("");
</script>
</body>
</html>

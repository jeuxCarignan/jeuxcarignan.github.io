<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>c et g</title>
<link rel="apple-touch-icon" href="../icon.png">
<link rel="manifest" href="../manifest.json">
<script src="../score.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cartable">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F9FF; --line:#D6E2F7; --line2:#B9CCEE; --margin:#EFA0A0;
  --ink:#1D2A4D; --soft:#5A6788; --card:#FFFFFF;
  --blue:#2F6FDB; --orange:#F29B30; --green:#2E9E5B; --red:#D9473F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131A2B; --line:#1C2640; --line2:#26345A; --margin:#5A2A33;
    --ink:#EEF2FF; --soft:#A6B1D1; --card:#1C2540;
    --blue:#6B9BF0; --orange:#F5AE52; --green:#4CC27E; --red:#F0716A;
  }
}
:root[data-theme="dark"]{
  --paper:#131A2B; --line:#1C2640; --line2:#26345A; --margin:#5A2A33;
  --ink:#EEF2FF; --soft:#A6B1D1; --card:#1C2540;
  --blue:#6B9BF0; --orange:#F5AE52; --green:#4CC27E; --red:#F0716A;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  font-family:"Andika","Comic Sans MS",system-ui,sans-serif;color:var(--ink);
  background-color:var(--paper);
  background-image:
    linear-gradient(90deg,transparent 22px,var(--margin) 22px,var(--margin) 24px,transparent 24px),
    repeating-linear-gradient(0deg,var(--line2) 0 1px,transparent 1px 32px),
    repeating-linear-gradient(0deg,var(--line) 0 1px,transparent 1px 8px),
    repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 32px);
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.screen{display:none;min-height:100%;max-width:520px;margin:0 auto;padding:16px 16px 24px 36px;flex-direction:column}
.screen.on{display:flex}

/* Accueil */
.backhub{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line2);border-radius:14px;padding:10px 14px;font-size:1.05rem;font-weight:700;color:var(--ink);text-decoration:none;min-height:48px}
h1{font-size:2.3rem;line-height:1.1;margin:18px 0 6px;font-weight:700}
.intro{color:var(--soft);font-size:1.05rem;margin:0 0 22px}
.group{margin-bottom:20px}
.group h2{font-size:1.15rem;margin:0 0 8px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:2px solid var(--line2);border-radius:14px;padding:12px 14px;font-size:1.1rem;min-height:52px;flex:1 1 auto;text-align:left}
.chip[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue);font-weight:700}
.chip small{display:block;color:var(--soft);font-size:.9rem;font-weight:400}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:2px solid var(--line2);border-radius:14px;padding:12px 14px;width:100%;font-size:1.1rem;text-align:left;margin-bottom:8px}
.switch{width:52px;height:30px;border-radius:15px;background:var(--line2);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle[aria-pressed="true"] .switch{background:var(--green)}
.toggle[aria-pressed="true"] .switch::after{transform:translateX(22px)}
.go{margin-top:auto;background:var(--blue);color:#fff;border:0;border-radius:18px;font-size:1.5rem;font-weight:700;padding:18px;min-height:64px;box-shadow:0 5px 0 color-mix(in srgb,var(--blue) 60%,#000)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--blue) 60%,#000)}
.ghost{background:var(--card);border:2px solid var(--line2);border-radius:18px;font-size:1.2rem;padding:14px;width:100%;min-height:56px}

/* Jeu */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.icon{background:var(--card);border:2px solid var(--line2);border-radius:14px;width:48px;height:48px;font-size:1.4rem;flex:none;display:grid;place-items:center}
.dots{display:flex;gap:5px;flex:1;justify-content:center}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);background:var(--card)}
.dot.now{border-color:var(--blue)}
.dot.done{background:var(--blue);border-color:var(--blue)}
.rule{background:var(--card);border:2px solid var(--line2);border-radius:16px;padding:8px 12px;margin-bottom:12px;font-size:1.05rem;line-height:1.5}
.rule b{color:var(--blue)} .rule i{color:var(--orange);font-style:normal;font-weight:700}
.question{font-size:1.4rem;font-weight:700;line-height:1.2;margin-bottom:10px}
.card{background:var(--card);border:3px solid var(--line2);border-radius:22px;padding:28px 10px;display:grid;place-items:center}
.word{font-size:clamp(3rem,15vw,4.4rem);font-weight:700;letter-spacing:.03em;line-height:1}
.word .t{color:var(--blue);background:color-mix(in srgb,var(--blue) 15%,var(--card));border-radius:12px;padding:0 .06em}
.word .n{color:var(--orange)}
.sounds{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.snd{background:var(--card);border:3px solid var(--line2);border-radius:18px;min-height:110px;box-shadow:0 5px 0 var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.snd:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line2)}
.snd b{font-size:2.8rem;line-height:1}
.snd small{font-size:.95rem;color:var(--soft)}
.snd.picked{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--card))}

/* Fin */
.end{align-items:center;text-align:center;gap:12px;padding-top:28px}
.note{font-size:clamp(4rem,22vw,6rem);font-weight:700;line-height:1;color:var(--blue)}
.note small{font-size:.45em;color:var(--soft)}
.end h2{font-size:2rem;margin:0}
.end p{font-size:1.15rem;color:var(--soft);margin:0}
.review{width:100%;text-align:left;display:flex;flex-direction:column;gap:10px;margin:6px 0}
.review h3{font-size:1.25rem;margin:8px 0 0}
.err{background:var(--card);border:2px solid var(--line2);border-left:6px solid var(--red);border-radius:14px;padding:12px 14px;font-size:1.05rem;line-height:1.45}
.err .head{display:flex;align-items:center;gap:10px;font-size:2rem;font-weight:700;margin-bottom:4px}
.err .head .e{font-size:2.2rem}
.err .t{color:var(--blue);background:color-mix(in srgb,var(--blue) 15%,var(--card));border-radius:8px;padding:0 .06em}
.err .n{color:var(--orange)}
.ok{color:var(--green);font-weight:700}
.no{color:var(--red);font-weight:700}
.tip{background:color-mix(in srgb,var(--blue) 10%,var(--card));border:2px solid var(--blue);border-radius:14px;padding:12px 14px;font-size:1.05rem;line-height:1.45}
.tip p{margin:6px 0 0;color:var(--ink);font-size:1.05rem}
.perfect{font-size:1.2rem}
.end .go{width:100%;margin-top:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section class="screen on" id="home">
  <a class="backhub" href="../index.html">← Mon cartable</a>
  <h1>ke ou se ?<br>gue ou je ?</h1>
  <p class="intro">10 questions pour savoir comment se lisent le c et le g.</p>
  <div class="group">
    <h2>Le jeu</h2>
    <div class="choices" id="modes">
      <button class="chip" data-mode="syl">Les syllabes<small>ca, ci, ge, go…</small></button>
      <button class="chip" data-mode="mot">Les mots<small>citron, gâteau, singe…</small></button>
    </div>
  </div>
  <div class="group">
    <h2>La lettre</h2>
    <div class="choices" id="sets">
      <button class="chip" data-set="c">Le c</button>
      <button class="chip" data-set="g">Le g</button>
      <button class="chip" data-set="cg">Le c et le g</button>
    </div>
  </div>
  <div class="group">
    <button class="toggle" id="tAide"><span>Montrer la règle et la lettre d'après</span><span class="switch"></span></button>
    <button class="toggle" id="tSon"><span>Lire la consigne à voix haute</span><span class="switch"></span></button>
  </div>
  <button class="go" id="start">C'est parti !</button>
</section>

<section class="screen" id="game">
  <div class="top">
    <button class="icon" id="back" aria-label="Retour au menu">⌂</button>
    <div class="dots" id="dots"></div>
    <button class="icon" id="say" aria-label="Écouter la consigne">🔊</button>
  </div>
  <div id="rule"></div>
  <div class="question" id="qText"></div>
  <div id="board"></div>
</section>

<section class="screen end" id="end">
  <div class="note"><span id="noteN"></span><small> / <span id="noteT"></span></small></div>
  <h2 id="endTitle"></h2>
  <p id="endText"></p>
  <div class="review" id="review"></div>
  <button class="go" id="redo">Refaire mes erreurs</button>
  <button class="go" id="again">Rejouer</button>
  <button class="ghost" id="menu">Changer de jeu</button>
</section>

<script>
const $ = s => document.querySelector(s);
const TOTAL = 10, ID = "cg";
let cfg = {mode:"syl", set:"c", aide:true, son:true};
try { Object.assign(cfg, JSON.parse(localStorage.getItem("cg-cfg") || "{}")); } catch(e){}
const save = () => { try { localStorage.setItem("cg-cfg", JSON.stringify(cfg)); } catch(e){} };

/* Les sons possibles pour chaque lettre */
const SON = {
  c: {dur:"ke",  doux:"se", ex:{ke:"🦆 canard", se:"🍋 citron"}},
  g: {dur:"gue", doux:"je", ex:{gue:"🎸 guitare", je:"🦒 girafe"}}
};
const DOUCES = "eéèêëiîïy";

/* Mots : «&nbsp;^&nbsp;» se place juste avant la lettre à lire. Le son est calculé avec la règle. */
const MOTS = [
  ["^canard","🦆"],["^café","☕"],["^carotte","🥕"],["^cochon","🐷"],["^cuillère","🥄"],["^cactus","🌵"],
  ["^cadeau","🎁"],["^camion","🚚"],["^coq","🐓"],["^crabe","🦀"],["^clé","🔑"],["^crocodile","🐊"],
  ["sa^c","👜"],["avo^cat","🥑"],["é^cole","🏫"],["es^cargot","🐌"],["^castor","🦫"],["^couronne","👑"],["^cœur","❤️"],
  ["^citron","🍋"],["^cerise","🍒"],["^cinéma","🎬"],["^cygne","🦢"],["^ciseaux","✂️"],["^cerf","🦌"],
  ["gla^ce","🍦"],["pou^ce","👍"],["poli^ce","👮"],["mer^ci","🙏"],["^cirque","🎪"],["^cent","💯"],["^cible","🎯"],
  ["gar^çon","👦"],["gla^çon","🧊"],["ma^çon","🧱"],["hame^çon","🎣"],["le^çon","📖"],
  ["^gâteau","🍰"],["^gorille","🦍"],["^guitare","🎸"],["^goutte","💧"],["^grenouille","🐸"],["^gant","🧤"],
  ["lé^gume","🥦"],["kan^gourou","🦘"],["dra^gon","🐉"],["ti^gre","🐯"],["^grue","🏗️"],["^gare","🚉"],
  ["^golf","⛳"],["ba^gue","💍"],["^glace","🍦"],["escar^got","🐌"],
  ["^girafe","🦒"],["^genou","🦵"],["^gilet","🦺"],["sin^ge","🐒"],["oran^ge","🍊"],["nua^ge","☁️"],
  ["pla^ge","🏖️"],["froma^ge","🧀"],["pa^ge","📄"],["^gendarme","👮"],["auber^gine","🍆"],["ma^gicien","🧙"],
  ["^gymnase","🤸"],["an^ge","👼"],["rou^ge","🔴"],["nei^ge","❄️"],
].map(([m,e]) => item(m.replace("^",""), m.indexOf("^"), e));

const SYLLABES = ["ca","co","cu","ce","ci","cy","cé","cr","cl","ça","ço","çu","ga","go","gu","ge","gi","gy","gé","gr","gl"]
  .map(s => item(s, 0, ""));

function item(texte, i, emoji){
  const L = texte[i], lettre = (L === "g") ? "g" : "c";
  const nx = texte[i+1];
  const doux = L === "ç" || (nx !== undefined && DOUCES.includes(nx));
  return {texte, i, emoji, L, lettre, nx, rep: doux ? SON[lettre].doux : SON[lettre].dur};
}

let q = 0, results = [], errors = [], queue = null, total = TOTAL, cur = null, locked = false, used = new Set();

/* ---------- Accueil ---------- */
function paintHome(){
  document.querySelectorAll("#modes .chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === cfg.mode));
  document.querySelectorAll("#sets .chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.set === cfg.set));
  $("#tAide").setAttribute("aria-pressed", cfg.aide);
  $("#tSon").setAttribute("aria-pressed", cfg.son);
}
$("#modes").onclick = e => { const b = e.target.closest(".chip"); if(!b) return; cfg.mode = b.dataset.mode; save(); paintHome(); };
$("#sets").onclick = e => { const b = e.target.closest(".chip"); if(!b) return; cfg.set = b.dataset.set; save(); paintHome(); };
$("#tAide").onclick = () => { cfg.aide = !cfg.aide; save(); paintHome(); };
$("#tSon").onclick = () => { cfg.son = !cfg.son; save(); paintHome(); };
paintHome();
function show(id){ document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); window.scrollTo(0,0); }

/* ---------- Voix (consigne seulement : on ne lit jamais le mot, sinon on donne la réponse) ---------- */
let frVoice = null;
function pickVoice(){ if(!("speechSynthesis" in window)) return; const v = speechSynthesis.getVoices(); frVoice = v.find(x => /^fr(-|_)FR/i.test(x.lang)) || v.find(x => /^fr/i.test(x.lang)) || null; }
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(t, force){
  if(!(cfg.son || force) || !("speechSynthesis" in window)) return;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "fr-FR"; u.rate = .9; if(frVoice) u.voice = frVoice; speechSynthesis.speak(u); }catch(e){}
}

/* ---------- Questions ---------- */
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[rnd(0, arr.length-1)];
const lettres = () => cfg.set === "cg" ? ["c","g"] : [cfg.set];

function newQuestion(){
  if(queue) return queue.shift();
  const source = cfg.mode === "mot" ? MOTS : SYLLABES;
  const lettre = pick(lettres());
  const doux = Math.random() < .5;  // moitié «&nbsp;dur&nbsp;», moitié «&nbsp;doux&nbsp;»
  let pool = source.filter(x => x.lettre === lettre && (x.rep === SON[lettre].doux) === doux && !used.has(x.texte + x.i));
  if(!pool.length){ used.clear(); pool = source.filter(x => x.lettre === lettre && (x.rep === SON[lettre].doux) === doux); }
  const it = pick(pool); used.add(it.texte + it.i);
  return it;
}
function startGame(list){
  queue = Array.isArray(list) ? list.map(e => e.q) : null;
  total = queue ? queue.length : TOTAL;
  q = 0; results = []; errors = []; used.clear();
  show("game"); next();
}
function dots(){
  $("#dots").innerHTML = Array.from({length:total}, (_,i) => `<span class="dot ${i < results.length ? "done" : (i === q ? "now" : "")}"></span>`).join("");
}
function marque(it, aide){
  const t = it.texte, i = it.i;
  const nx = it.nx === undefined ? "" : (aide ? `<span class="n">${it.nx}</span>` : it.nx);
  return t.slice(0,i) + `<span class="t">${t[i]}</span>` + nx + t.slice(i+2);
}
const CONSIGNE = "Comment se lit la lettre bleue ?";
function next(){
  if(q >= total) return finish();
  cur = newQuestion(); locked = false; dots();
  $("#rule").innerHTML = cfg.aide ? `<div class="rule">${lettres().map(l =>
      `<b>${l}</b> + <i>e i y</i> → ${SON[l].doux} &nbsp; <b>${l}</b> + <i>a o u</i> → ${SON[l].dur}`).join("<br>")}${lettres().includes("c") ? "<br><b>ç</b> → se" : ""}</div>` : "";
  $("#qText").textContent = CONSIGNE;
  const s = SON[cur.lettre];
  $("#board").innerHTML = `<div class="card"><div class="word">${marque(cur, cfg.aide)}</div></div>
    <div class="sounds">${[s.dur, s.doux].map(v => `<button class="snd" data-v="${v}"><b>${v}</b><small>comme ${s.ex[v]}</small></button>`).join("")}</div>`;
  if(q === 0) speak(CONSIGNE);
}

// Pas de correction pendant la partie : on enregistre et on passe à la suite.
$("#board").onclick = e => {
  const b = e.target.closest(".snd"); if(!b || locked) return;
  locked = true; b.classList.add("picked");
  const ok = b.dataset.v === cur.rep;
  results.push(ok);
  if(!ok) errors.push({q:cur, choix:b.dataset.v});
  q++; dots();
  setTimeout(next, 250);
};

/* ---------- Fin de partie ---------- */
function pourquoi(it){
  const L = it.lettre, s = SON[L];
  if(it.L === "ç") return `Le c a une cédille (ç) : il fait toujours <span class="ok">«&nbsp;se&nbsp;»</span>.`;
  if(it.nx === undefined) return `Le ${L} est à la fin du mot : il fait <span class="ok">«&nbsp;${s.dur}&nbsp;»</span>.`;
  if(DOUCES.includes(it.nx)) return `Après le ${L}, il y a «&nbsp;<span class="n">${it.nx}</span>&nbsp;». Devant e, i, y, le ${L} fait <span class="ok">«&nbsp;${s.doux}&nbsp;»</span>.`;
  if("aâàoôuûœ".includes(it.nx)) return `Après le ${L}, il y a «&nbsp;<span class="n">${it.nx}</span>&nbsp;». Devant a, o, u, le ${L} fait <span class="ok">«&nbsp;${s.dur}&nbsp;»</span>.`;
  return `Après le ${L}, il y a la consonne «&nbsp;<span class="n">${it.nx}</span>&nbsp;» : le ${L} fait <span class="ok">«&nbsp;${s.dur}&nbsp;»</span>.`;
}
function errorCard(e){
  const it = e.q;
  return `<div class="err"><div class="head">${it.emoji ? `<span class="e">${it.emoji}</span>` : ""}<span>${marque(it, true)}</span></div>
    Tu as choisi <span class="no">«&nbsp;${e.choix}&nbsp;»</span>. Il fallait <span class="ok">«&nbsp;${it.rep}&nbsp;»</span>.<br>${pourquoi(it)}</div>`;
}
function conseil(){
  const t = [];
  const douxRate = errors.some(e => e.q.rep === SON[e.q.lettre].doux && e.q.L !== "ç");
  const durRate  = errors.some(e => e.q.rep === SON[e.q.lettre].dur);
  if(douxRate) t.push("Les lettres <strong>e, i, y</strong> rendent le c et le g tout doux : <strong>c</strong> fait «&nbsp;se&nbsp;» et <strong>g</strong> fait «&nbsp;je&nbsp;».");
  if(durRate)  t.push("Devant <strong>a, o, u</strong> ou une consonne, le c et le g restent durs : <strong>c</strong> fait «&nbsp;ke&nbsp;» et <strong>g</strong> fait «&nbsp;gue&nbsp;».");
  if(errors.some(e => e.q.L === "ç")) t.push("La <strong>cédille</strong> sous le ç, c'est comme une petite queue de serpent : ç fait toujours «&nbsp;se&nbsp;».");
  t.push("Astuce : regarde toujours la lettre <strong>juste après</strong> le c ou le g avant de lire.");
  return `<div class="tip"><strong>Pour progresser :</strong>${t.map(x => `<p>${x}</p>`).join("")}</div>`;
}
function finish(){
  const n = results.filter(Boolean).length, ratio = n / total;
  const title = ratio === 1 ? "Parfait !" : ratio >= .8 ? "Très bien !" : ratio >= .5 ? "Bien, continue !" : "On s'entraîne encore !";
  $("#noteN").textContent = n; $("#noteT").textContent = total; $("#endTitle").textContent = title;
  let txt = "";
  if(queue) txt = `Tu as corrigé ${n} erreur${n>1?"s":""} sur ${total}.`;
  else if(window.Cartable){
    const r = Cartable.enregistrer(`${ID}-${cfg.mode}-${cfg.set}`, n, TOTAL); // une note par jeu et par niveau
    if(r.precedente !== null)
      txt = n > r.precedente ? `Tu progresses : ${r.precedente} / ${TOTAL} la dernière fois.`
          : n === r.precedente ? `Comme la dernière fois (${r.precedente} / ${TOTAL}).`
          : `La dernière fois : ${r.precedente} / ${TOTAL}. Tu vas y arriver !`;
  }
  $("#endText").textContent = txt;
  if(errors.length){
    $("#review").innerHTML = `<h3>Tes erreurs</h3>` + errors.map(errorCard).join("") + conseil();
    $("#redo").style.display = ""; $("#again").className = "ghost";
  } else {
    $("#review").innerHTML = `<p class="perfect">Aucune erreur, bravo ! 🎉</p>`;
    $("#redo").style.display = "none"; $("#again").className = "go";
  }
  show("end");
  speak(`${title} ${n} sur ${total}.${errors.length ? " Regarde tes erreurs pour progresser." : ""}`);
}

$("#start").onclick = () => startGame();
$("#again").onclick = () => startGame();
$("#redo").onclick = () => startGame(errors);
$("#menu").onclick = () => { paintHome(); show("home"); };
